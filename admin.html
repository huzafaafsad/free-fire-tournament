<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FF Tournament — Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .wrap {
      width: min(1000px, calc(100% - 30px));
      margin: auto;
      padding: 30px 0;
    }

    .login,
    .dashboard {
      max-width: 500px;
      margin: 70px auto;
      background: #121212;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 25px;
    }

    .dashboard {
      max-width: 1000px;
    }

    h1 {
      margin-top: 0;
    }

    .accent {
      color: #ff9d00;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0 14px;
      border: 1px solid #333;
      border-radius: 9px;
      background: #0b0b0b;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #ff9d00;
      color: #111;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }

    button.secondary {
      background: #222;
      color: white;
      margin-top: 10px;
    }

    .error {
      color: #ff5555;
      margin-top: 12px;
    }

    .success {
      color: #55d98a;
      margin-top: 12px;
    }

    .hidden {
      display: none;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 25px 0;
    }

    .card {
      padding: 20px;
      background: #191919;
      border: 1px solid #292929;
      border-radius: 12px;
    }

    .card small {
      color: #aaa;
    }

    .card strong {
      display: block;
      margin-top: 8px;
      color: #ff9d00;
      font-size: 28px;
    }

    @media (max-width: 650px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div id="loginPage" class="login">
  <h1>FF<span class="accent">TOURNAMENT</span></h1>
  <p>Admin Login</p>

  <form id="loginForm">
    <label>Email</label>
    <input id="email" type="email" required autocomplete="email">

    <label>Password</label>
    <input id="password" type="password" required autocomplete="current-password">

    <button type="submit">LOGIN</button>
  </form>

  <div id="loginMessage"></div>
</div>


<div id="dashboardPage" class="dashboard hidden">

  <h1>Admin <span class="accent">Dashboard</span></h1>

  <p id="adminEmail"></p>

  <div class="stats">

    <div class="card">
      <small>Tournaments</small>
      <strong id="tournamentCount">0</strong>
    </div>

    <div class="card">
      <small>Players</small>
      <strong id="playerCount">0</strong>
    </div>

    <div class="card">
      <small>Payments</small>
      <strong id="paymentCount">0</strong>
    </div>

  </div>

  <button id="logoutButton" class="secondary">
    LOGOUT
  </button>

  <div id="dashboardMessage"></div>

</div>


<script>
  const SUPABASE_URL =
    "https://deqbclnbckvyrttqztds.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_sW1o5gc_Soe4VOADvbZH2g_4Jap5-5A";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  const loginPage = document.getElementById("loginPage");
  const dashboardPage = document.getElementById("dashboardPage");
  const loginForm = document.getElementById("loginForm");
  const loginMessage = document.getElementById("loginMessage");
  const dashboardMessage = document.getElementById("dashboardMessage");


  function showLogin(message = "") {
    loginPage.classList.remove("hidden");
    dashboardPage.classList.add("hidden");
    loginMessage.textContent = message;
  }


  function showDashboard(email) {
    loginPage.classList.add("hidden");
    dashboardPage.classList.remove("hidden");
    document.getElementById("adminEmail").textContent =
      "Logged in as: " + email;
  }


  async function checkAdmin(user) {

    const { data, error } = await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .maybeSingle();

    if (error) {
      throw error;
    }

    if (!data || data.role !== "admin") {
      await supabaseClient.auth.signOut();

      throw new Error(
        "This account does not have administrator access."
      );
    }

    return true;
  }


  async function loadDashboard() {

    const tournaments = await supabaseClient
      .from("tournaments")
      .select("id", { count: "exact", head: true });

    const players = await supabaseClient
      .from("profiles")
      .select("id", { count: "exact", head: true })
      .eq("role", "player");

    const payments = await supabaseClient
      .from("payments")
      .select("id", { count: "exact", head: true });

    if (tournaments.error || players.error || payments.error) {
      dashboardMessage.className = "error";
      dashboardMessage.textContent =
        "Dashboard data could not be loaded.";
      return;
    }

    document.getElementById("tournamentCount").textContent =
      tournaments.count ?? 0;

    document.getElementById("playerCount").textContent =
      players.count ?? 0;

    document.getElementById("paymentCount").textContent =
      payments.count ?? 0;
  }


  loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    loginMessage.className = "";
    loginMessage.textContent = "Logging in...";

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      loginMessage.className = "error";
      loginMessage.textContent = error.message;
      return;
    }

    try {

      await checkAdmin(data.user);

      showDashboard(data.user.email);

      await loadDashboard();

    } catch (adminError) {

      loginMessage.className = "error";
      loginMessage.textContent = adminError.message;

    }

  });


  document.getElementById("logoutButton")
    .addEventListener("click", async function() {

      await supabaseClient.auth.signOut();

      showLogin("You have been logged out.");

    });


  async function initialize() {

    const { data } =
      await supabaseClient.auth.getSession();

    if (!data.session) {
      showLogin();
      return;
    }

    try {

      await checkAdmin(data.session.user);

      showDashboard(data.session.user.email);

      await loadDashboard();

    } catch (error) {

      showLogin(error.message);

    }

  }


  initialize();
</script>

</body>
</html>
