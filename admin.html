<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Fire Tournament - Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: min(1100px, calc(100% - 30px));
      margin: auto;
      padding: 25px 0 60px;
    }

    .box {
      background: #121212;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .login-box {
      max-width: 450px;
      margin: 80px auto;
    }

    h1,
    h2,
    h3 {
      margin-top: 0;
    }

    .accent {
      color: #ff9d00;
    }

    label {
      display: block;
      margin: 10px 0 7px;
      color: #ccc;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #333;
      border-radius: 9px;
      background: #090909;
      color: #fff;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      padding: 13px 18px;
      border: 0;
      border-radius: 9px;
      background: #ff9d00;
      color: #111;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .secondary {
      background: #252525;
      color: #fff;
    }

    .danger {
      background: #b52b2b;
      color: #fff;
    }

    .hidden {
      display: none !important;
    }

    .message {
      margin-top: 12px;
      line-height: 1.5;
    }

    .error {
      color: #ff5c5c;
    }

    .success {
      color: #55d98a;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .tournament {
      background: #181818;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 17px;
      margin-top: 12px;
    }

    .meta {
      color: #aaa;
      line-height: 1.8;
      font-size: 14px;
    }

    .actions {
      margin-top: 12px;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        flex-direction: column;
        align-items: stretch;
      }

      .topbar button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage" class="container login-box">

  <div class="box">

    <h1>
      FF<span class="accent">TOURNAMENT</span>
    </h1>

    <h2>Admin Login</h2>

    <form id="loginForm">

      <label>Email</label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        required
      >

      <label>Password</label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        LOGIN
      </button>

    </form>

    <div id="loginMessage" class="message"></div>

  </div>

</div>


<!-- ADMIN -->

<div id="adminPage" class="container hidden">

  <div class="topbar">

    <div>
      <h1>
        FF<span class="accent">TOURNAMENT</span>
      </h1>

      <div id="adminEmail"></div>
    </div>

    <button
      id="logoutButton"
      class="secondary"
    >
      LOGOUT
    </button>

  </div>


  <!-- CREATE TOURNAMENT -->

  <div class="box">

    <h2>Create Tournament</h2>

    <form id="tournamentForm">

      <div class="grid">

        <div>

          <label>Tournament Name</label>

          <input
            id="name"
            type="text"
            placeholder="Friday Night Battle"
            required
          >

        </div>


        <div>

          <label>Game Mode</label>

          <select id="gameMode">

            <option value="Solo">
              Solo
            </option>

            <option value="Duo">
              Duo
            </option>

            <option value="Squad" selected>
              Squad
            </option>

          </select>

        </div>


        <div>

          <label>Entry Fee</label>

          <input
            id="entryFee"
            type="number"
            min="0"
            step="0.01"
            required
          >

        </div>


        <div>

          <label>Prize Pool</label>

          <input
            id="prizePool"
            type="number"
            min="0"
            step="0.01"
            required
          >

        </div>


        <div>

          <label>Total Slots</label>

          <input
            id="totalSlots"
            type="number"
            min="1"
            required
          >

        </div>


        <div>

          <label>Start Time</label>

          <input
            id="startTime"
            type="datetime-local"
            required
          >

        </div>

      </div>


      <label>Description</label>

      <textarea
        id="description"
        placeholder="Tournament rules and details"
      ></textarea>


      <label>Status</label>

      <select id="status">

        <option value="upcoming">
          Upcoming
        </option>

        <option value="open" selected>
          Open for Registration
        </option>

        <option value="live">
          Live
        </option>

        <option value="completed">
          Completed
        </option>

        <option value="cancelled">
          Cancelled
        </option>

      </select>


      <button
        id="createButton"
        type="submit"
      >
        CREATE TOURNAMENT
      </button>


      <div id="formMessage" class="message"></div>

    </form>

  </div>


  <!-- TOURNAMENT LIST -->

  <div class="box">

    <h2>My Tournaments</h2>

    <div id="tournamentList">
      Loading tournaments...
    </div>

  </div>

</div>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://deqbclnbckvyrttqztds.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_sW1o5gc_Soe4VOADvbZH2g_4Jap5-5A";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =========================
     ELEMENTS
  ========================= */

  const loginPage =
    document.getElementById("loginPage");

  const adminPage =
    document.getElementById("adminPage");

  const loginForm =
    document.getElementById("loginForm");

  const loginButton =
    document.getElementById("loginButton");

  const loginMessage =
    document.getElementById("loginMessage");

  const adminEmail =
    document.getElementById("adminEmail");

  const tournamentForm =
    document.getElementById("tournamentForm");

  const createButton =
    document.getElementById("createButton");

  const formMessage =
    document.getElementById("formMessage");

  const tournamentList =
    document.getElementById("tournamentList");


  /* =========================
     MESSAGE
  ========================= */

  function showError(element, message) {

    element.className =
      "message error";

    element.textContent =
      message;
  }


  function showSuccess(element, message) {

    element.className =
      "message success";

    element.textContent =
      message;
  }


  /* =========================
     ADMIN CHECK
  ========================= */

  async function verifyAdmin(user) {

    if (!user || !user.id) {
      throw new Error(
        "No authenticated user found."
      );
    }


    const { data, error } =
      await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();


    if (error) {

      throw new Error(
        "Profile check failed: " +
        error.message
      );

    }


    if (!data) {

      throw new Error(
        "No profile found."
      );

    }


    if (data.role !== "admin") {

      await supabaseClient.auth.signOut();

      throw new Error(
        "This account is not an admin."
      );

    }

  }


  /* =========================
     SHOW ADMIN
  ========================= */

  function showAdmin(user) {

    loginPage.classList.add("hidden");

    adminPage.classList.remove("hidden");

    adminEmail.textContent =
      "Logged in as: " +
      user.email;

  }


  /* =========================
     LOAD TOURNAMENTS
  ========================= */

  async function loadTournaments() {

    tournamentList.textContent =
      "Loading tournaments...";


    const { data, error } =
      await supabaseClient
        .from("tournaments")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      showError(
        tournamentList,
        "Could not load tournaments: " +
        error.message
      );

      return;
    }


    if (!data || data.length === 0) {

      tournamentList.innerHTML =
        "<p>No tournaments created yet.</p>";

      return;
    }


    tournamentList.innerHTML = "";


    data.forEach(tournament => {

      const card =
        document.createElement("div");

      card.className =
        "tournament";


      const startTime =
        tournament.start_time
          ? new Date(
              tournament.start_time
            ).toLocaleString()
          : "Not set";


      card.innerHTML = `

        <h3>
          ${escapeHtml(tournament.name)}
        </h3>

        <div class="meta">

          Mode:
          ${escapeHtml(tournament.game_mode)}
          <br>

          Entry Fee:
          ${Number(
            tournament.entry_fee || 0
          ).toFixed(2)}
          <br>

          Prize Pool:
          ${Number(
            tournament.prize_pool || 0
          ).toFixed(2)}
          <br>

          Slots:
          ${tournament.total_slots}
          <br>

          Start:
          ${escapeHtml(startTime)}
          <br>

          Status:
          ${escapeHtml(tournament.status)}

        </div>

        <div class="actions">

          <button
            class="danger"
            data-delete="${tournament.id}"
          >
            DELETE
          </button>

        </div>

      `;


      tournamentList.appendChild(card);

    });


    document
      .querySelectorAll("[data-delete]")
      .forEach(button => {

        button.addEventListener(
          "click",
          function() {

            deleteTournament(
              button.dataset.delete
            );

          }
        );

      });

  }


  /* =========================
     CREATE TOURNAMENT
     IMPORTANT:
     Uses RPC instead of direct INSERT
  ========================= */

  tournamentForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      formMessage.textContent = "";

      createButton.disabled = true;

      createButton.textContent =
        "CREATING...";


      try {

        const name =
          document
            .getElementById("name")
            .value
            .trim();


        const description =
          document
            .getElementById("description")
            .value
            .trim();


        const entryFee =
          Number(
            document
              .getElementById("entryFee")
              .value
          );


        const prizePool =
          Number(
            document
              .getElementById("prizePool")
              .value
          );


        const totalSlots =
          Number(
            document
              .getElementById("totalSlots")
              .value
          );


        const gameMode =
          document
            .getElementById("gameMode")
            .value;


        const startTime =
          document
            .getElementById("startTime")
            .value;


        const status =
          document
            .getElementById("status")
            .value;


        if (!name) {
          throw new Error(
            "Tournament name is required."
          );
        }


        if (entryFee < 0) {
          throw new Error(
            "Entry fee cannot be negative."
          );
        }


        if (prizePool < 0) {
          throw new Error(
            "Prize pool cannot be negative."
          );
        }


        if (totalSlots < 1) {
          throw new Error(
            "Total slots must be at least 1."
          );
        }


        if (!startTime) {
          throw new Error(
            "Start time is required."
          );
        }


        const startDate =
          new Date(startTime);


        if (
          Number.isNaN(
            startDate.getTime()
          )
        ) {

          throw new Error(
            "Invalid start time."
          );

        }


        /* =========================
           RPC CALL
        ========================= */

        const { data, error } =
          await supabaseClient.rpc(
            "create_tournament",
            {
              p_name:
                name,

              p_description:
                description,

              p_entry_fee:
                entryFee,

              p_prize_pool:
                prizePool,

              p_total_slots:
                totalSlots,

              p_game_mode:
                gameMode,

              p_start_time:
                startDate.toISOString(),

              p_status:
                status
            }
          );


        if (error) {

          console.error(
            "Tournament RPC error:",
            error
          );

          throw new Error(
            "Database error: " +
            error.message
          );

        }


        console.log(
          "Tournament created:",
          data
        );


        showSuccess(
          formMessage,
          "Tournament created successfully."
        );


        tournamentForm.reset();


        await loadTournaments();


      } catch (error) {

        console.error(
          "Create tournament error:",
          error
        );


        showError(
          formMessage,
          error.message
        );

      } finally {

        createButton.disabled =
          false;

        createButton.textContent =
          "CREATE TOURNAMENT";

      }

    }
  );


  /* =========================
     DELETE
  ========================= */

  async function deleteTournament(id) {

    const confirmed =
      confirm(
        "Delete this tournament? This cannot be undone."
      );


    if (!confirmed) {
      return;
    }


    const { error } =
      await supabaseClient
        .from("tournaments")
        .delete()
        .eq("id", id);


    if (error) {

      alert(
        "Delete failed: " +
        error.message
      );

      return;
    }


    await loadTournaments();

  }


  /* =========================
     LOGIN
  ========================= */

  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      loginButton.disabled =
        true;

      loginButton.textContent =
        "LOGGING IN...";


      loginMessage.textContent =
        "Checking account...";


      try {

        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        const { data, error } =
          await supabaseClient.auth
            .signInWithPassword({

              email:
                email,

              password:
                password

            });


        if (error) {

          throw new Error(
            "Login failed: " +
            error.message
          );

        }


        if (
          !data ||
          !data.user
        ) {

          throw new Error(
            "No user returned after login."
          );

        }


        await verifyAdmin(
          data.user
        );


        showAdmin(
          data.user
        );


        await loadTournaments();


      } catch (error) {

        console.error(
          "Login error:",
          error
        );


        showError(
          loginMessage,
          error.message
        );

      } finally {

        loginButton.disabled =
          false;

        loginButton.textContent =
          "LOGIN";

      }

    }
  );


  /* =========================
     LOGOUT
  ========================= */

  document
    .getElementById("logoutButton")
    .addEventListener(
      "click",
      async function() {

        await supabaseClient
          .auth
          .signOut();


        adminPage
          .classList
          .add("hidden");


        loginPage
          .classList
          .remove("hidden");


        loginForm.reset();


        loginMessage.textContent =
          "Logged out successfully.";

      }
    );


  /* =========================
     HTML ESCAPE
  ========================= */

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* =========================
     INITIAL SESSION
  ========================= */

  async function initialize() {

    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .getSession();


      if (error) {
        throw error;
      }


      if (
        !data ||
        !data.session ||
        !data.session.user
      ) {
        return;
      }


      await verifyAdmin(
        data.session.user
      );


      showAdmin(
        data.session.user
      );


      await loadTournaments();


    } catch (error) {

      console.error(
        "Session error:",
        error
      );

    }

  }


  initialize();

</script>

</body>
</html>
