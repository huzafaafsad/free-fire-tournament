<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FF Tournament — Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(1100px, calc(100% - 30px));
      margin: auto;
      padding: 25px 0 50px;
    }

    .box {
      background: #121212;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
    }

    h1, h2, h3 { margin-top: 0; }

    .accent { color: #ff9d00; }

    input, textarea, select {
      width: 100%;
      padding: 13px;
      margin: 7px 0 14px;
      border: 1px solid #333;
      border-radius: 9px;
      background: #090909;
      color: white;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      padding: 13px 18px;
      border: 0;
      border-radius: 9px;
      background: #ff9d00;
      color: #111;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #252525;
      color: white;
    }

    button.danger {
      background: #b72b2b;
      color: white;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .login {
      max-width: 450px;
      margin: 80px auto;
    }

    .hidden { display: none !important; }

    .error {
      color: #ff5c5c;
      margin-top: 12px;
    }

    .success {
      color: #55d98a;
      margin-top: 12px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .topbar button {
      width: auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .tournament {
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 17px;
      margin-top: 12px;
      background: #181818;
    }

    .tournament h3 {
      margin-bottom: 8px;
    }

    .meta {
      color: #aaa;
      line-height: 1.7;
      font-size: 14px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .actions button {
      flex: 1;
      min-width: 120px;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .topbar button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="container login">
  <div class="box">
    <h1>FF<span class="accent">TOURNAMENT</span></h1>
    <h2>Admin Login</h2>

    <form id="loginForm">
      <label>Email</label>
      <input id="email" type="email" required>

      <label>Password</label>
      <input id="password" type="password" required>

      <button type="submit">LOGIN</button>
    </form>

    <div id="loginMessage"></div>
  </div>
</div>


<!-- ADMIN -->
<div id="adminPage" class="container hidden">

  <div class="topbar">
    <div>
      <h1>FF<span class="accent">TOURNAMENT</span></h1>
      <div id="adminEmail"></div>
    </div>

    <button id="logoutButton" class="secondary">Logout</button>
  </div>


  <!-- CREATE TOURNAMENT -->
  <div class="box">
    <h2>Create Tournament</h2>

    <form id="tournamentForm">

      <div class="grid">

        <div>
          <label>Tournament Name</label>
          <input id="name" type="text" required placeholder="Friday Night Battle">
        </div>

        <div>
          <label>Game Mode</label>
          <select id="gameMode">
            <option value="Solo">Solo</option>
            <option value="Duo">Duo</option>
            <option value="Squad" selected>Squad</option>
          </select>
        </div>

        <div>
          <label>Entry Fee</label>
          <input id="entryFee" type="number" min="0" step="0.01" required>
        </div>

        <div>
          <label>Prize Pool</label>
          <input id="prizePool" type="number" min="0" step="0.01" required>
        </div>

        <div>
          <label>Total Slots</label>
          <input id="totalSlots" type="number" min="1" required>
        </div>

        <div>
          <label>Start Time</label>
          <input id="startTime" type="datetime-local" required>
        </div>

      </div>

      <label>Description</label>
      <textarea id="description" placeholder="Tournament rules and details"></textarea>

      <label>Status</label>
      <select id="status">
        <option value="upcoming">Upcoming</option>
        <option value="open">Open for Registration</option>
        <option value="live">Live</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
      </select>

      <button id="createButton" type="submit">
        CREATE TOURNAMENT
      </button>

      <div id="formMessage"></div>

    </form>
  </div>


  <!-- TOURNAMENT LIST -->
  <div class="box">
    <h2>My Tournaments</h2>

    <div id="tournamentList">
      Loading tournaments...
    </div>
  </div>

</div>


<script>
  const SUPABASE_URL =
    "https://deqbclnbckvyrttqztds.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_sW1o5gc_Soe4VOADvbZH2g_4Jap5-5A";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  const loginPage =
    document.getElementById("loginPage");

  const adminPage =
    document.getElementById("adminPage");

  const loginMessage =
    document.getElementById("loginMessage");

  const formMessage =
    document.getElementById("formMessage");

  const tournamentList =
    document.getElementById("tournamentList");


  function showError(element, message) {
    element.className = "error";
    element.textContent = message;
  }


  function showSuccess(element, message) {
    element.className = "success";
    element.textContent = message;
  }


  async function verifyAdmin(user) {

    const { data, error } =
      await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .maybeSingle();

    if (error) throw error;

    if (!data || data.role !== "admin") {
      await supabaseClient.auth.signOut();
      throw new Error("This account is not an admin.");
    }
  }


  function showAdmin(user) {
    loginPage.classList.add("hidden");
    adminPage.classList.remove("hidden");

    document.getElementById("adminEmail").textContent =
      "Logged in as: " + user.email;
  }


  async function loadTournaments() {

    tournamentList.textContent = "Loading tournaments...";

    const { data, error } =
      await supabaseClient
        .from("tournaments")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
      showError(
        tournamentList,
        "Could not load tournaments: " + error.message
      );
      return;
    }

    if (!data || data.length === 0) {
      tournamentList.innerHTML =
        "<p>No tournaments created yet.</p>";
      return;
    }

    tournamentList.innerHTML = "";

    data.forEach(tournament => {

      const card =
        document.createElement("div");

      card.className = "tournament";

      const startTime =
        tournament.start_time
          ? new Date(tournament.start_time).toLocaleString()
          : "Not set";

      card.innerHTML = `
        <h3>${escapeHtml(tournament.name)}</h3>

        <div class="meta">
          Mode: ${escapeHtml(tournament.game_mode)}<br>
          Entry Fee: ${Number(tournament.entry_fee).toFixed(2)}<br>
          Prize Pool: ${Number(tournament.prize_pool).toFixed(2)}<br>
          Slots: ${tournament.total_slots}<br>
          Start: ${escapeHtml(startTime)}<br>
          Status: ${escapeHtml(tournament.status)}
        </div>

        <div class="actions">
          <button
            class="danger"
            data-delete="${tournament.id}">
            DELETE
          </button>
        </div>
      `;

      tournamentList.appendChild(card);
    });

    document
      .querySelectorAll("[data-delete]")
      .forEach(button => {

        button.addEventListener("click", () => {
          deleteTournament(button.dataset.delete);
        });

      });
  }


  async function deleteTournament(id) {

    const confirmed =
      confirm("Delete this tournament? This cannot be undone.");

    if (!confirmed) return;

    const { error } =
      await supabaseClient
        .from("tournaments")
        .delete()
        .eq("id", id);

    if (error) {
      alert("Delete failed: " + error.message);
      return;
    }

    await loadTournaments();
  }


  document
    .getElementById("tournamentForm")
    .addEventListener("submit", async event => {

      event.preventDefault();

      formMessage.textContent = "";

      const button =
        document.getElementById("createButton");

      button.disabled = true;
      button.textContent = "CREATING...";

      const name =
        document.getElementById("name").value.trim();

      const description =
        document.getElementById("description").value.trim();

      const entryFee =
        Number(document.getElementById("entryFee").value);

      const prizePool =
        Number(document.getElementById("prizePool").value);

      const totalSlots =
        Number(document.getElementById("totalSlots").value);

      const gameMode =
        document.getElementById("gameMode").value;

      const startTime =
        document.getElementById("startTime").value;

      const status =
        document.getElementById("status").value;


      if (
        !name ||
        entryFee < 0 ||
        prizePool < 0 ||
        totalSlots < 1 ||
        !startTime
      ) {
        showError(
          formMessage,
          "Please fill all required fields correctly."
        );

        button.disabled = false;
        button.textContent = "CREATE TOURNAMENT";
        return;
      }


      const { error } =
        await supabaseClient
          .from("tournaments")
          .insert({
            name,
            description,
            entry_fee: entryFee,
            prize_pool: prizePool,
            total_slots: totalSlots,
            game_mode: gameMode,
            start_time: new Date(startTime).toISOString(),
            status
          });


      if (error) {

        showError(
          formMessage,
          "Could not create tournament: " + error.message
        );

      } else {

        showSuccess(
          formMessage,
          "Tournament created successfully."
        );

        document
          .getElementById("tournamentForm")
          .reset();

        await loadTournaments();
      }


      button.disabled = false;
      button.textContent = "CREATE TOURNAMENT";
    });


  document
    .getElementById("logoutButton")
    .addEventListener("click", async () => {

      await supabaseClient.auth.signOut();

      adminPage.classList.add("hidden");
      loginPage.classList.remove("hidden");

      loginMessage.textContent = "Logged out.";
    });


  document
    .getElementById("loginForm")
    .addEventListener("submit", async event => {

      event.preventDefault();

      loginMessage.className = "";
      loginMessage.textContent = "Logging in...";

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });


      if (error) {

        showError(
          loginMessage,
          error.message
        );

        return;
      }


      try {

        await verifyAdmin(data.user);

        showAdmin(data.user);

        await loadTournaments();

      } catch (error) {

        showError(
          loginMessage,
          error.message
        );
      }

    });


  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  async function initialize() {

    const { data } =
      await supabaseClient.auth.getSession();

    if (!data.session) return;

    try {

      await verifyAdmin(data.session.user);

      showAdmin(data.session.user);

      await loadTournaments();

    } catch (error) {

      await supabaseClient.auth.signOut();

    }
  }


  initialize();
</script>

</body>
</html>
