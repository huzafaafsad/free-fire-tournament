<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FF Tournament - Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      padding: 18px 20px;
      border-bottom: 1px solid #292929;
      background: #111;
    }

    header h1 {
      font-size: 22px;
    }

    header span {
      color: #ff9d00;
    }

    .container {
      width: min(1100px, calc(100% - 30px));
      margin: 30px auto;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h2 {
      font-size: 30px;
      margin-bottom: 6px;
    }

    .welcome p {
      color: #999;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }

    .card {
      background: #121212;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 20px;
    }

    .card small {
      color: #999;
    }

    .card strong {
      display: block;
      font-size: 28px;
      margin-top: 8px;
      color: #ff9d00;
    }

    .section {
      margin-top: 25px;
    }

    .section h3 {
      margin-bottom: 15px;
      font-size: 20px;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #181818;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      border-color: #ff9d00;
      color: #ff9d00;
    }

    .logout {
      margin-top: 30px;
      background: #ff9d00;
      color: #111;
      border: none;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 420px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>FF<span>TOURNAMENT</span> — ADMIN</h1>
  </header>

  <main class="container">

    <div class="welcome">
      <h2>Admin Dashboard</h2>
      <p>Manage your tournaments and players from one place.</p>
    </div>

    <div class="stats">

      <div class="card">
        <small>Total Tournaments</small>
        <strong id="tournaments">0</strong>
      </div>

      <div class="card">
        <small>Total Players</small>
        <strong id="players">0</strong>
      </div>

      <div class="card">
        <small>Pending Payments</small>
        <strong id="payments">0</strong>
      </div>

      <div class="card">
        <small>Pending Registrations</small>
        <strong id="registrations">0</strong>
      </div>

    </div>

    <section class="section">
      <h3>Management</h3>

      <div class="actions">

        <button onclick="showMessage('Tournament Manager')">
          🏆 Tournament Manager
        </button>

        <button onclick="showMessage('Player Manager')">
          👥 Player Manager
        </button>

        <button onclick="showMessage('Payment Verification')">
          💳 Payment Verification
        </button>

        <button onclick="showMessage('Room Manager')">
          🎮 Room ID & Password
        </button>

        <button onclick="showMessage('Results Manager')">
          🏅 Results & Leaderboard
        </button>

        <button onclick="showMessage('Notifications')">
          🔔 Notifications
        </button>

      </div>
    </section>

    <button class="logout" onclick="logout()">
      LOGOUT
    </button>

  </main>

  <script>
    function showMessage(section) {
      alert(section + " will be connected to Supabase next.");
    }

    function logout() {
      alert("Admin logout will be connected with Supabase Auth next.");
    }
  </script>

</body>
</html>
